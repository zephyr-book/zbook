board:
  full_name: zbook
  name: zbook
  vendor: edge
  revision:
    # format: custom means Zephyr includes revision.cmake and ignores the
    # `default` key entirely (see cmake/modules/boards.cmake), so the real
    # default lives in revision.cmake. This is kept in sync only so the
    # metadata does not contradict it.
    format: custom
    default: p1
    revisions:
      - name: p1
      - name: p2
  socs:
    - name: rp2350b
      variants:
        - name: mcuboot
          cpucluster: m33
