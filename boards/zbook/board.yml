board:
  full_name: zbook
  name: zbook
  vendor: edge
  revision:
    # format: custom means Zephyr includes revision.cmake and ignores this
    # `default` key (see cmake/modules/boards.cmake), so the effective default
    # lives there. Kept in sync only so the metadata does not contradict it.
    format: custom
    default: p2
    revisions:
      - name: p1
      - name: p2
  socs:
    - name: rp2350b
      variants:
        - name: mcuboot
          cpucluster: m33
